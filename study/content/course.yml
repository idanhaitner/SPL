id: systems-programming
title: Systems Programming
lang: en
dir: ltr
term: "2026"
summary: >
  Systems Programming (תכנות מערכות, 202-1-2031) is the practice of writing
  libraries and services that other programs use, close to the machine they
  run on. Following Meni Adler's lecture notes, the course moves through four
  parts: memory management in C++, from the run-time environment to objects,
  inheritance, and polymorphism; concurrency with Java threads, safety and
  correctness, synchronization, and waiting; communication between processes,
  from sockets to a general server, the reactor, and a command-invocation
  server; and databases, with SQL and a Python persistence layer. The
  languages are C++, Java, Python, and SQL.

changelog:
  - date: 2026-10-17
    note: "First guide from the thirteen lecture decks, the thirteen exercise sessions, and the 2015-2024 exams."
  - date: 2026-10-18
    note: "Chapters follow the lecture decks. Past-paper practice no longer shows the year or the moed."
  - date: 2026-10-18
    note: "Each chapter gained a diagram of the idea it teaches, and three short traces for frames, pointer steps, and the link stage."
  - date: 2026-10-18
    note: "Worked examples now open on a real code block, with call, leak, static, and recursion pictures in the memory chapter."
  - date: 2026-10-18
    note: "The guide is in Hebrew, with the lecture names for each idea and the English terms the slides keep."
  - date: 2026-10-19
    note: "Adler's lecture notes: runtime environment and process states, the i = i + j machine trace, pass-by choice, client-side locking, and the versioned iterator."
  - date: 2026-10-19
    note: "Practice cards use a short title, and a question that depended on a slide or a previous card now carries that code or table."
  - date: 2026-10-19
    note: "The memory chapter now explains in full sentences why a call frame fits the stack, what is still correct when a heap block leaks, and why delete and delete[] are not the same."
  - date: 2026-10-19
    note: "The memory chapter's explanation of why the stack and the heap are split no longer repeats the leak, recursion, and delete examples already shown above it."
  - date: 2026-10-19
    note: "Lectures, session decks, exams, and notes live under materials/. The runnable practice files live under practice/."
  - date: 2026-10-19
    note: "Lesson prose was replaced with the clearer wording in fixed_content.md. Practice questions, hints, and diagrams stayed in place."
  - date: 2026-10-19
    note: "Rule of five chapter rewritten from fixed_rule_of_5.md."
  - date: 2026-10-20
    note: "Memory-model chapter replaced with the corrected wording. Diagrams and topic links that the paste dropped were put back."
  - date: 2026-10-21
    note: "The guide is in English again. Chapter prose, glossary, and the course introduction use the syllabus names for the run-time environment, ownership, concurrency, protocols, and persistence."
  - date: 2026-10-23
    note: "Lesson prose is short bullets with the key term in bold, so a chapter can be scanned instead of read as a wall of paragraphs."
  - date: 2026-10-23
    note: "Long chapter openings are a short roadmap only; definition lists moved into the first real sections (memory model, inheritance, concurrency, reactor)."
  - date: 2026-10-23
    note: "Diagrams point at the real files under study/web/public/figures, so the pictures load on GitHub as well as on the site. A few cut-off sentences were completed."
  - date: 2026-10-23
    note: "Every chapter opening is a short what-you-will-learn roadmap. Bold terms load Heebo 700; the old Key-terms overview fold is gone."
  - date: 2026-10-23
    note: "Memory-model practice stays on regions, frames, and delete. The mvector exam items moved to rule-of-three and inheritance."
  - date: 2026-10-23
    note: "Practice stays inside the chapter that teaches it: image-repository copies, C++ locks, and the store-prices reactor wiring each moved to that chapter."
  - date: 2026-10-23
    note: "The pointers chapter explains references with binding examples: lvalue versus rvalue, const references, and what a return may name."
  - date: 2026-10-23
    note: "The lvalue and rvalue section now walks each expression and a table of which references may bind to it."
  - date: 2026-10-23
    note: "Parameter passing shows a call for each form, and code line numbers sit in a gutter beside the text."
  - date: 2026-10-25
    note: "Chapters follow the order and material of Adler's lecture notes: a run-time environment chapter, the Student, Bag, and Book memory examples, design by contract as safety and correctness inside concurrency, new synchronization and waiting chapters, the general server, the command-invocation server, the Python persistence layer, and a course review. Back to Java was folded into the chapters that use it."

