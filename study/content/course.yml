id: systems-programming
title: תכנות מערכות
lang: he
dir: rtl
term: "2026"
summary: >
  תכנות מערכות (202-1-2031) מפרק תוכנית אל המכונה שהיא באמת רצה עליה.
  מציירים את המחסנית ואת הערימה, כותבים את הפונקציות המיוחדות שמחלקה ב-C++
  צריכה כשהיא מחזיקה זיכרון, ואז עוברים ל-Java, לחוטים, לשקעים, ל-Reactor,
  ולבסיס נתונים רלציוני.

changelog:
  - date: 2026-10-17
    note: "First guide from the thirteen lecture decks, the thirteen exercise sessions, and the 2015-2024 exams."
  - date: 2026-10-18
    note: "Chapters follow the lecture decks. Past-paper practice no longer shows the year or the moed."
  - date: 2026-10-18
    note: "Each chapter gained a diagram of the idea it teaches, and three short traces for frames, pointer steps, and the link stage."
  - date: 2026-10-18
    note: "Worked examples now open on a real code block, with call, leak, static, and recursion pictures in the memory chapter."
  - date: 2026-10-18
    note: "The guide is in Hebrew, with the lecture names for each idea and the English terms the slides keep."
  - date: 2026-10-19
    note: "Adler's lecture notes: runtime environment and process states, the i = i + j machine trace, pass-by choice, client-side locking, and the versioned iterator."
  - date: 2026-10-19
    note: "Practice cards use a short title, and a question that depended on a slide or a previous card now carries that code or table."
  - date: 2026-10-19
    note: "The memory chapter now explains in full sentences why a call frame fits the stack, what is still correct when a heap block leaks, and why delete and delete[] are not the same."
  - date: 2026-10-19
    note: "The memory chapter's explanation of why the stack and the heap are split no longer repeats the leak, recursion, and delete examples already shown above it."
  - date: 2026-10-19
    note: "Lectures, session decks, exams, and notes live under materials/. The runnable practice files live under practice/."
  - date: 2026-10-19
    note: "Lesson prose was replaced with the clearer wording in fixed_content.md. Practice questions, hints, and diagrams stayed in place."
  - date: 2026-10-19
    note: "Rule of five chapter rewritten from fixed_rule_of_5.md."
  - date: 2026-10-20
    note: "Memory-model chapter replaced with the corrected wording. Diagrams and topic links that the paste dropped were put back."

