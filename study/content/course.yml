  - id: rule-of-three
    file: topics/rule-of-three.md
    title: The rule of three
    exam_weight: core
    exam_shape: "A small class owns a raw array. Write the destructor and the deep copy. The trap is the default memberwise copy, or an assignment that frees the buffer before the new one exists."
    prerequisites: [classes-and-objects]
    unlocks: [rule-of-five]
  - id: rule-of-five
    file: topics/rule-of-five.md
    title: The rule of five and smart pointers
    exam_weight: core
    exam_shape: "Steal a buffer, or delay the clone until a write. The trap is leaving the source pointer alive so two destructors free one block, or copying a unique_ptr."
    prerequisites: [rule-of-three]
    unlocks: [inheritance]
  - id: inheritance
    file: topics/inheritance.md
    title: Inheritance and polymorphism
    exam_weight: core
    exam_shape: "Two derived types sit behind one base pointer. The call is non-virtual, the destructor is non-virtual, or an overload is used where an override was needed. The trap is a memory drawing that omits the vptr, or a delete through the base that skips the derived destructor."
    prerequisites: [rule-of-five]
    unlocks: [concurrency]
  - id: concurrency
    file: topics/concurrency.md
    title: Threads
    exam_weight: taught
    prerequisites: [inheritance]
    unlocks: [design-by-contract]
  - id: design-by-contract
    file: topics/design-by-contract.md
    title: Safety and correctness
    exam_weight: core
    exam_shape: "Write the invariant and the preconditions and postconditions of a method. The trap is an invariant that forgets the empty case, or a postcondition that is only true when nobody else mutates the object."
    prerequisites: [concurrency]
    unlocks: [synchronization]
  - id: synchronization
    file: topics/synchronization.md
    title: Synchronization
    exam_weight: core
    exam_shape: "A shared structure. Show a race, or repair it with synchronized, an immutable copy, or an atomic compare-and-set. The trap is protecting the update but not the read that publishes it, or relying on a thread-safe class across two calls."
    prerequisites: [design-by-contract]
    unlocks: [waiting-and-liveness]
  - id: waiting-and-liveness
    file: topics/waiting-and-liveness.md
    title: Waiting and liveness
    exam_weight: core
    exam_shape: "A guarded wait on a shared queue or resource, or a deadlock to explain and fix. The trap is if instead of while around wait, notify where notifyAll is needed, or a lock order that waits forever."
    prerequisites: [synchronization]
    unlocks: [networking]
  - id: networking
    file: topics/networking.md
    title: Communication between processes
    exam_weight: core
    exam_shape: "Replace a delimiter with a length prefix, cap the clients, or write a small command protocol. The trap is treating a TCP read as a whole message, or forgetting that UDP has no accept."
    prerequisites: [waiting-and-liveness]
    unlocks: [reactor]
  - id: reactor
    file: topics/reactor.md
    title: Server design and the reactor
    exam_weight: core
    exam_shape: "Edit the reactor from the appendix. Move tokenization off the selector, cap work per client, add a log, or serve a query without blocking select. The trap is a heavy call on the selector thread, or leaving OP_WRITE set so select spins."
    prerequisites: [networking]
    unlocks: [serialization]
  - id: serialization
    file: topics/serialization.md
    title: The command-invocation server
    exam_weight: core
    prerequisites: [reactor]
    unlocks: [persistence]
  - id: persistence
    file: topics/persistence.md
    title: Databases
    exam_weight: core
    exam_shape: "Design the tables, with a primary key, foreign keys, and a junction table for a many-to-many, then write one SELECT with a join. The trap is a Cartesian product with no join condition, or a list stored as columns instead of a junction table."
    prerequisites: [serialization]
    unlocks: [course-review]
  - id: course-review
    file: topics/course-review.md
    title: Course review
    exam_weight: taught
    prerequisites: [persistence]
    unlocks: []

glossary:
  - term: stack
    topic: memory-model
    definition: "The LIFO region of automatic storage. Each call has one activation frame, and that frame is released when the call returns."
  - term: heap
    topic: memory-model
    definition: "The region of dynamic storage. A block is obtained with new and released only by a matching delete."
  - term: pointer
    topic: pointers
    definition: "A variable whose value is the address of another object, or null when it points at nothing."
  - term: reference
    topic: pointers
    definition: "A second name for an existing object. It must be bound when it is created, it cannot be null, and it cannot be rebound to another object."
  - term: destructor
    topic: rule-of-three
    definition: "The special member function that runs when an object's lifetime ends and releases what the object owns."
  - term: copy constructor
    topic: rule-of-three
    definition: "The constructor that builds a new object as a deep copy of another object of the same type."
  - term: assignment operator
    topic: rule-of-three
    definition: "The copy assignment operator runs when one existing object is assigned to another. It replaces the target's resources with a copy of the source's, and it must stay safe when both are the same object."
  - term: move constructor
    topic: rule-of-five
    definition: "The constructor that takes the source object's buffer and leaves the source empty, so the source destructor releases nothing."
  - term: RAII
    topic: rule-of-five
    definition: "Resource Acquisition Is Initialization. An object acquires a resource when it is created and releases it in its destructor, so the resource lives exactly as long as the object."
  - term: unique_ptr
    topic: rule-of-five
    definition: "A smart pointer that is the sole owner of one object. It cannot be copied, but it can be moved, and it deletes the object when it is destroyed."
  - term: shared_ptr
    topic: rule-of-five
    definition: "A smart pointer that shares ownership through a reference count and deletes the object when the count reaches zero."
  - term: virtual function
    topic: inheritance
    definition: "A member function whose implementation is chosen from the dynamic type of the object, through the vtable."
  - term: vtable
    topic: inheritance
    definition: "The per-class table of virtual-function addresses. Each object holds a vptr to its class's table."
  - term: invariant
    topic: design-by-contract
    definition: "A condition that is true of an object whenever no public method of the object is running."
  - term: precondition
    topic: design-by-contract
    definition: "What the caller must establish before a method runs. The method may assume that it holds."
  - term: postcondition
    topic: design-by-contract
    definition: "What the method establishes when it returns, provided the precondition held."
  - term: thread
    topic: concurrency
    definition: "A sequential flow of execution inside a process. It has its own stack and shares the process heap with the other threads."
  - term: deadlock
    topic: waiting-and-liveness
    definition: "A cycle of waiting in which each thread holds a lock that the next thread needs, so all of them stay blocked forever."
  - term: livelock
    topic: waiting-and-liveness
    definition: "A failure in which the threads are not blocked, but each spends its time reacting to the others, so no work ever finishes."
  - term: starvation
    topic: waiting-and-liveness
    definition: "A failure in which a thread that is ready to run is passed over indefinitely, because other threads keep getting the CPU or the lock first."
  - term: TCP
    topic: networking
    definition: "A connection-oriented, reliable byte stream. A read returns some of the bytes, not necessarily one application message."
  - term: UDP
    topic: networking
    definition: "A connectionless datagram protocol. There is no accept, and a datagram arrives whole or not at all."
  - term: reactor
    topic: reactor
    definition: "A server design in which one thread waits in select and handles only the non-blocking channels that are ready, while a pool of workers runs the protocol."
  - term: selector
    topic: reactor
    definition: "The Java NIO object that reports which registered channels are ready to read or to write."
  - term: serialization
    topic: serialization
    definition: "A representation of an object as a byte sequence that records its type, the shape of its fields, and the field values."
  - term: primary key
    topic: persistence
    definition: "The column, or set of columns, whose value is unique in every row, so it identifies each row of the table."
  - term: foreign key
    topic: persistence
    definition: "A column whose values must equal a key of another table. It is the relational form of a pointer."
  - term: process
    topic: run-time-environment
    definition: "One running execution of a program, with its own address space and its own execution state. The program itself is only the passive list of instructions."
  - term: runtime environment
    topic: run-time-environment
    definition: "The layer between a program and the infrastructure it runs on. It preserves the infrastructure's properties, hides its details behind a more convenient interface, and adds services the hardware does not provide."
  - term: system call
    topic: run-time-environment
    definition: "The way a process asks the operating system's kernel for a service, such as reading a file. Unlike an ordinary function call, the kernel performs the operation."

  - term: critical section
    topic: synchronization
    definition: "A stretch of code that at most one thread may run at a time. In Java it is marked with synchronized, which locks an object for the length of the block."
  - term: immutable object
    topic: synchronization
    definition: "An object whose fields never change after its constructor. A command returns a new copy instead of assigning, so the object is safe to share between threads."
  - term: compare-and-set
    topic: synchronization
    definition: "An atomic processor operation that writes a new value to a cell only if the cell still holds an expected old value. It is the basis of lock-free synchronization."
  - term: semaphore
    topic: waiting-and-liveness
    definition: "A synchronizer with a number of permits. acquire waits until a permit is free and takes it, tryAcquire returns false instead of waiting, and release gives a permit back."
  - term: smart pointer
    topic: rule-of-five
    definition: "A class that wraps an address on the heap with a reference count, and deletes the object when the last copy that knows the address is gone."
  - term: double dispatch
    topic: inheritance
    definition: "A pattern that chooses code by the dynamic types of two objects, by making a virtual call on the first and then a second virtual call on the parameter."
  - term: actor thread pool
    topic: reactor
    definition: "An executor that keeps a queue of tasks per actor, such as a client, and never runs two tasks of the same actor at the same time, so each client's messages run in order."
  - term: DBMS
    topic: persistence
    definition: "A database management system: a run-time environment for data that outlives the process, with queries, integrity constraints, concurrency, and transactions."

