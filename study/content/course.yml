topics:
  - id: memory-model
    file: topics/memory-model.md
    title: מודל הזיכרון
    exam_weight: core
    exam_shape: "Draw the stack and the heap after a by-value call. The trap is putting the buffer on the stack, or drawing a by-value parameter as the same object as the caller's."
    prerequisites: []
    unlocks: [pointers]
  - id: pointers
    file: topics/pointers.md
    title: מצביעים ורפרנסים
    exam_weight: tested
    exam_shape: "A repository of images behind a pointer array, returned by value from a local. The trap is treating the return as a copy of the pixels, or using sizeof of a pointer as a length."
    prerequisites: [memory-model]
    unlocks: [classes-and-objects]
  - id: classes-and-objects
    file: topics/classes-and-objects.md
    title: מחלקות ועצמים
    exam_weight: taught
    prerequisites: [pointers]
    unlocks: [rule-of-three]
  - id: rule-of-three
    file: topics/rule-of-three.md
    title: חוק השלושה
    exam_weight: core
    exam_shape: "A small class owns a raw array. Write the destructor and the deep copy. The trap is the default memberwise copy, or an assignment that frees the buffer before the new one exists."
    prerequisites: [classes-and-objects]
    unlocks: [rule-of-five]
  - id: rule-of-five
    file: topics/rule-of-five.md
    title: חוק החמישה וחוק האפס
    exam_weight: core
    exam_shape: "Steal a buffer, or delay the clone until a write. The trap is leaving the source pointer alive so two destructors free one block, or copying a unique_ptr."
    prerequisites: [rule-of-three]
    unlocks: [inheritance]
  - id: inheritance
    file: topics/inheritance.md
    title: ירושה
    exam_weight: core
    exam_shape: "Two derived types sit behind one base pointer. The call is non-virtual, the destructor is non-virtual, or an overload is used where an override was needed. The trap is a memory drawing that omits the vptr, or a delete through the base that skips the derived destructor."
    prerequisites: [rule-of-five]
    unlocks: [java-runtime]
  - id: java-runtime
    file: topics/java-runtime.md
    title: חזרה ל-Java
    exam_weight: taught
    prerequisites: [inheritance]
    unlocks: [concurrency]
  - id: concurrency
    file: topics/concurrency.md
    title: מקביליות
    exam_weight: core
    exam_shape: "A shared structure. Show a race, a deadlock, or a repair with synchronized, a semaphore, or an atomic. The trap is a lock order that waits forever, or protecting the update but not the read that publishes it."
    prerequisites: [java-runtime]
    unlocks: [design-by-contract]
  - id: design-by-contract
    file: topics/design-by-contract.md
    title: תכנון לפי חוזה
    exam_weight: core
    exam_shape: "Write the invariant and the preconditions and postconditions of a method. The trap is an invariant that forgets the empty case, or a postcondition that is only true when nobody else mutates the object."
    prerequisites: [concurrency]
    unlocks: [networking]
  - id: networking
    file: topics/networking.md
    title: תקשורת
    exam_weight: core
    exam_shape: "Replace a delimiter with a length prefix, cap the clients, or write a small command protocol. The trap is treating a TCP read as a whole message, or forgetting that UDP has no accept."
    prerequisites: [design-by-contract]
    unlocks: [reactor]
  - id: reactor
    file: topics/reactor.md
    title: Reactor
    exam_weight: core
    exam_shape: "Edit the reactor from the appendix. Move tokenization off the selector, cap work per client, add a log, or serve a query without blocking select. The trap is a heavy call on the selector thread, or leaving OP_WRITE set so select spins."
    prerequisites: [networking]
    unlocks: [serialization]
  - id: serialization
    file: topics/serialization.md
    title: סיריאליזציה
    exam_weight: taught
    prerequisites: [reactor]
    unlocks: [persistence]
  - id: persistence
    file: topics/persistence.md
    title: אחסון ו-SQL
    exam_weight: core
    exam_shape: "Design the tables, with a primary key, foreign keys, and a junction table for a many-to-many, then write one SELECT with a join. The trap is a Cartesian product with no join condition, or a list stored as columns instead of a junction table."
    prerequisites: [serialization]
    unlocks: []

glossary:
  - term: stack
    topic: memory-model
    definition: "המחסנית. אזור האחסון האוטומטי בסדר LIFO. לכל קריאה יש מסגרת הפעלה אחת, והיא משתחררת כשהקריאה חוזרת."
  - term: heap
    topic: memory-model
    definition: "הערימה. אזור האחסון הדינמי. מקבלים אותו ב-new ומשחררים רק ב-delete תואם."
  - term: pointer
    topic: pointers
    definition: "מצביע. אובייקט שהערך שלו הוא הכתובת של אובייקט אחר, או null."
  - term: reference
    topic: pointers
    definition: "רפרנס. שם שקשור לאובייקט קיים. הוא לא יכול להיות null, ואי אפשר לקשור אותו מחדש."
  - term: destructor
    topic: rule-of-three
    definition: "דיסטרקטור. הפונקציה המיוחדת שרצה כשזמן החיים של אובייקט נגמר, ומשחררת את מה שהוא מחזיק."
  - term: copy constructor
    topic: rule-of-three
    definition: "בנאי העתקה. הבנאי שבונה אובייקט חדש כעותק עמוק של אובייקט אחר מאותו טיפוס."
  - term: assignment operator
    topic: rule-of-three
    definition: "אופרטור השמה. מחליף את המשאבים של אובייקט קיים בעותק של אובייקט אחר, ונשאר בטוח גם אם שניהם אותו אובייקט."
  - term: move constructor
    topic: rule-of-five
    definition: "בנאי-העברה. גונב את המאגר של אובייקט המקור ומשאיר את המקור ריק, כך שהדיסטרקטור שלו לא משחרר כלום."
  - term: RAII
    topic: rule-of-five
    definition: "קישור זמן החיים של משאב לזמן החיים של אובייקט, כך שהדיסטרקטור הוא השחרור."
  - term: unique_ptr
    topic: rule-of-five
    definition: "מצביע חכם ייחודי. מחזיק אובייקט אחד, אי אפשר להעתיק אותו, ואפשר להעביר אותו."
  - term: shared_ptr
    topic: rule-of-five
    definition: "מצביע חכם משותף. משתף בעלות באמצעות מונה, ומוחק את האובייקט כשהמונה מגיע לאפס."
  - term: virtual function
    topic: inheritance
    definition: "פונקציה וירטואלית. המימוש שלה נבחר לפי הטיפוס הדינמי של האובייקט, דרך ה-vtable."
  - term: vtable
    topic: inheritance
    definition: "הטבלה של כתובות הפונקציות הווירטואליות, אחת לכל מחלקה. כל אובייקט מחזיק vptr לטבלה של המחלקה שלו."
  - term: invariant
    topic: design-by-contract
    definition: "תנאי פנימי. נכון לגבי אובייקט בכל זמן שאף פעולה ציבורית שלו לא רצה."
  - term: precondition
    topic: design-by-contract
    definition: "תנאי קדם. מה שהקורא חייב לקיים לפני שפעולה רצה. הפעולה רשאית להניח שהוא מתקיים."
  - term: postcondition
    topic: design-by-contract
    definition: "תנאי סיום. מה שהפעולה מבטיחה כשהיא חוזרת, בתנאי שתנאי הקדם התקיים."
  - term: thread
    topic: concurrency
    definition: "חוט-ביצוע. רצף סדרתי שחולק את הערימה של התהליך עם שאר החוטים."
  - term: deadlock
    topic: concurrency
    definition: "נעילה הדדית. מעגל המתנה שבו כל חוט מחזיק מנעול שהחוט הבא צריך."
  - term: livelock
    topic: concurrency
    definition: "החוטים ממשיכים לשנות מצב זה בתגובה לזה, ולא מתקדמים."
  - term: starvation
    topic: concurrency
    definition: "הרעבה. חוט שמוכן לרוץ נדחה בלי סוף על ידי המתזמן או על ידי המנעול."
  - term: TCP
    topic: networking
    definition: "זרם בתים אמין מעל חיבור. קריאה מחזירה חלק מהבתים, לא בהכרח הודעה שלמה."
  - term: UDP
    topic: networking
    definition: "פרוטוקול דטגרמים בלי חיבור. אין accept, ודטגרם מגיע שלם או בכלל לא."
  - term: reactor
    topic: reactor
    definition: "חוט אחד שממתין ב-select ומפנה ערוצים לא חוסמים שמוכנים."
  - term: selector
    topic: reactor
    definition: "אובייקט ה-NIO של Java שמדווח אילו ערוצים רשומים מוכנים לקריאה או לכתיבה."
  - term: serialization
    topic: serialization
    definition: "סיריאליזציה. ייצוג של אובייקט כסדרת בתים שרושמת את הטיפוס, את צורת השדות, ואת ערכי השדות."
  - term: primary key
    topic: persistence
    definition: "מפתח ראשי. העמודה או העמודות שמזהות שורה אחת בטבלה."
  - term: foreign key
    topic: persistence
    definition: "מפתח זר. עמודה שהערכים שלה חייבים להיות שווים למפתח של טבלה אחרת. הצורה הרלציונית של מצביע."
  - term: process
    topic: memory-model
    definition: "תהליך. תוכנית בזמן שהיא רצה על מחשב, עם מרחב כתובות משלה ומצב ריצה משלה."
  - term: runtime environment
    topic: memory-model
    definition: "סביבת זמן ריצה. השכבה בין התוכנית לתשתית: היא שומרת על תכונות התשתית, מוסיפה הפשטה, ממשק נוח, ושירותים שאין לחומרה."
  - term: system call
    topic: memory-model
    definition: "קריאת מערכת. פונקציה שמערכת ההפעלה נותנת לתהליך כדי לגשת לחומרה, במקום שהתהליך ייגע בחומרה בעצמו."

