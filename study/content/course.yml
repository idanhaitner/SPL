id: systems-programming
title: Systems Programming
lang: en
dir: ltr
term: "2026"
summary: >
  Systems Programming (תכנות מערכות, 202-1-2031) takes a program apart into
  the machine it actually runs on. You draw the stack and the heap, write the
  special member functions a C++ class needs when it owns memory, then move
  through Java, threads, sockets, the reactor, and a relational database.

changelog:
  - date: 2026-10-17
    note: "First guide from the thirteen lecture decks, the thirteen exercise sessions, and the 2015-2024 exams."
  - date: 2026-10-18
    note: "Chapters follow the lecture decks. Past-paper practice no longer shows the year or the moed."
  - date: 2026-10-18
    note: "Each chapter gained a diagram of the idea it teaches, and three short traces for frames, pointer steps, and the link stage."

