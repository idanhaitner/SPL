topics:
  - id: memory-model
    file: topics/memory-model.md
    title: The memory model
    exam_weight: core
    exam_shape: "Draw the stack and the heap after a by-value call. The trap is putting the buffer on the stack, or drawing a by-value parameter as the same object as the caller's."
    prerequisites: []
    unlocks: [pointers]
  - id: pointers
    file: topics/pointers.md
    title: Pointers and references
    exam_weight: tested
    exam_shape: "A repository of images behind a pointer array, returned by value from a local. The trap is treating the return as a copy of the pixels, or using sizeof of a pointer as a length."
    prerequisites: [memory-model]
    unlocks: [classes-and-objects]
  - id: classes-and-objects
    file: topics/classes-and-objects.md
    title: Classes and objects
    exam_weight: taught
    prerequisites: [pointers]
    unlocks: [rule-of-three]
  - id: rule-of-three
    file: topics/rule-of-three.md
    title: Rule of three
    exam_weight: core
    exam_shape: "A small class owns a raw array. Write the destructor and the deep copy. The trap is the default memberwise copy, or an assignment that frees the buffer before the new one exists."
    prerequisites: [classes-and-objects]
    unlocks: [rule-of-five]
  - id: rule-of-five
    file: topics/rule-of-five.md
    title: Rule of five and zero
    exam_weight: core
    exam_shape: "Steal a buffer, or delay the clone until a write. The trap is leaving the source pointer alive so two destructors free one block, or copying a unique_ptr."
    prerequisites: [rule-of-three]
    unlocks: [inheritance]
  - id: inheritance
    file: topics/inheritance.md
    title: Inheritance and polymorphism
    exam_weight: core
    exam_shape: "Two derived types sit behind one base pointer. The call is non-virtual, the destructor is non-virtual, or an overload is used where an override was needed. The trap is a memory drawing that omits the vptr, or a delete through the base that skips the derived destructor."
    prerequisites: [rule-of-five]
    unlocks: [java-runtime]
  - id: java-runtime
    file: topics/java-runtime.md
    title: Back to Java
    exam_weight: taught
    prerequisites: [inheritance]
    unlocks: [concurrency]
  - id: concurrency
    file: topics/concurrency.md
    title: Concurrency
    exam_weight: core
    exam_shape: "A shared structure. Show a race, a deadlock, or a repair with synchronized, a semaphore, or an atomic. The trap is a lock order that waits forever, or protecting the update but not the read that publishes it."
    prerequisites: [java-runtime]
    unlocks: [design-by-contract]
  - id: design-by-contract
    file: topics/design-by-contract.md
    title: Design by contract
    exam_weight: core
    exam_shape: "Write the invariant and the preconditions and postconditions of a method. The trap is an invariant that forgets the empty case, or a postcondition that is only true when nobody else mutates the object."
    prerequisites: [concurrency]
    unlocks: [networking]
  - id: networking
    file: topics/networking.md
    title: Networking
    exam_weight: core
    exam_shape: "Replace a delimiter with a length prefix, cap the clients, or write a small command protocol. The trap is treating a TCP read as a whole message, or forgetting that UDP has no accept."
    prerequisites: [design-by-contract]
    unlocks: [reactor]
  - id: reactor
    file: topics/reactor.md
    title: The reactor
    exam_weight: core
    exam_shape: "Edit the reactor from the appendix. Move tokenization off the selector, cap work per client, add a log, or serve a query without blocking select. The trap is a heavy call on the selector thread, or leaving OP_WRITE set so select spins."
    prerequisites: [networking]
    unlocks: [serialization]
  - id: serialization
    file: topics/serialization.md
    title: Serialization
    exam_weight: taught
    prerequisites: [reactor]
    unlocks: [persistence]
  - id: persistence
    file: topics/persistence.md
    title: Persistence and SQL
    exam_weight: core
    exam_shape: "Design the tables, with a primary key, foreign keys, and a junction table for a many-to-many, then write one SELECT with a join. The trap is a Cartesian product with no join condition, or a list stored as columns instead of a junction table."
    prerequisites: [serialization]
    unlocks: []

glossary:
  - term: stack
    topic: memory-model
    definition: "The LIFO region of automatic storage, one activation frame per call, freed when the call returns."
  - term: heap
    topic: memory-model
    definition: "The region of dynamic storage obtained with new and released only by a matching delete."
  - term: pointer
    topic: pointers
    definition: "An object whose value is the address of another object, or null."
  - term: reference
    topic: pointers
    definition: "A name bound to an existing object. It cannot be null and it cannot be reseated."
  - term: destructor
    topic: rule-of-three
    definition: "The special member function that runs when an object's lifetime ends and that frees what the object owns."
  - term: copy constructor
    topic: rule-of-three
    definition: "The constructor that builds a new object as a deep copy of another of the same type."
  - term: assignment operator
    topic: rule-of-three
    definition: "The operator that replaces an existing object's resources with a copy of another's, and that must stay safe if the two are the same object."
  - term: move constructor
    topic: rule-of-five
    definition: "The constructor that steals a source object's buffer and leaves that source empty so its destructor frees nothing."
  - term: RAII
    topic: rule-of-five
    definition: "Binding a resource's lifetime to an object's lifetime, so the destructor is the release."
  - term: unique_ptr
    topic: rule-of-five
    definition: "A smart pointer that owns one object, cannot be copied, and can be moved."
  - term: shared_ptr
    topic: rule-of-five
    definition: "A smart pointer that shares ownership through a count and deletes the object when the count hits zero."
  - term: virtual function
    topic: inheritance
    definition: "A member function whose implementation is chosen from the dynamic type of the object, through the vtable."
  - term: vtable
    topic: inheritance
    definition: "The per-class table of virtual-function addresses. Each object holds a pointer to its class's table."
  - term: invariant
    topic: design-by-contract
    definition: "A condition that is true of an object whenever no method of the object is running."
  - term: precondition
    topic: design-by-contract
    definition: "What the caller must make true before a method runs. The method may assume it."
  - term: postcondition
    topic: design-by-contract
    definition: "What the method guarantees when it returns, provided the precondition held."
  - term: thread
    topic: concurrency
    definition: "A sequential flow of execution that shares the process heap with the other threads."
  - term: deadlock
    topic: concurrency
    definition: "A wait cycle in which each thread holds a lock the next thread needs."
  - term: livelock
    topic: concurrency
    definition: "Threads keep changing state in response to each other and never make progress."
  - term: starvation
    topic: concurrency
    definition: "A thread that is ready to run is passed over indefinitely by the scheduler or by the lock."
  - term: TCP
    topic: networking
    definition: "A connection-oriented, reliable byte stream. A read returns some of the bytes, not necessarily one message."
  - term: UDP
    topic: networking
    definition: "A connectionless datagram protocol. There is no accept, and a datagram arrives whole or not at all."
  - term: reactor
    topic: reactor
    definition: "One thread that waits in select and dispatches ready non-blocking channels."
  - term: selector
    topic: reactor
    definition: "The Java NIO object that reports which registered channels are ready to read or write."
  - term: serialization
    topic: serialization
    definition: "A representation of an object as a byte sequence that records its type, the shape of its fields, and the field values."
  - term: primary key
    topic: persistence
    definition: "The column or columns that identify one row of a table."
  - term: foreign key
    topic: persistence
    definition: "A column whose values must equal a key of another table, the relational form of a pointer."

