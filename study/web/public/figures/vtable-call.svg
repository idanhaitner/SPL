<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <style>
    .draw { opacity: 0; animation: appear 0.4s ease forwards; }
    .d2 { animation-delay: 0.4s; }
    .d3 { animation-delay: 0.8s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="300" fill="#f6f1e7"/>
  <g class="draw">
    <text x="160" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#8a5a22">האובייקט</text>
    <rect x="40" y="56" width="240" height="180" rx="14" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
    <text x="160" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">BlurFilter</text>
    <rect x="60" y="112" width="200" height="44" rx="8" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
    <text x="160" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#2a3142">vptr</text>
    <rect x="60" y="168" width="200" height="44" rx="8" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
    <text x="160" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#2a3142">_str</text>
  </g>
  <g class="draw d2">
    <text x="540" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#8a5a22">ה-vtable של BlurFilter</text>
    <rect x="400" y="56" width="320" height="136" rx="14" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
    <text x="560" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142">apply</text>
    <text x="560" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">BlurFilter::apply</text>
    <text x="560" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142">~BlurFilter</text>
  </g>
  <g class="draw d3">
    <line x1="260" y1="134" x2="384" y2="100" stroke="#c47b2b" stroke-width="2"/>
    <polygon points="392,96 376,94 380,108" fill="#c47b2b"/>
    <text x="380" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">Filter* p עדיין מוצא את BlurFilter::apply</text>
  </g>
</svg>
