    <text x="281" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="rtl" unicode-bidi="embed">קובץ <tspan direction="ltr" unicode-bidi="embed">.cpp</tspan> אחד ל-<tspan direction="ltr" unicode-bidi="embed">asm</tspan></text>
  </g>
  <g class="draw d3">
    <rect x="392" y="48" width="150" height="110" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5" />
    <text x="467" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="rtl" unicode-bidi="embed">אסמבלר</text>
    <text x="467" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="rtl" unicode-bidi="embed">כותב קובץ <tspan direction="ltr" unicode-bidi="embed">.o</tspan></text>
  </g>
  <g class="draw d4">
    <rect x="578" y="48" width="160" height="110" rx="12" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5" />
    <text x="658" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="rtl" unicode-bidi="embed">מקשר</text>
    <text x="658" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="rtl" unicode-bidi="embed">מוצא את <tspan direction="ltr" unicode-bidi="embed">main</tspan></text>
    <text x="658" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="rtl" unicode-bidi="embed">קובץ הרצה אחד</text>
  </g>
  <g class="draw d2">
    <polygon points="198,103 184,96 184,110" fill="#c47b2b" />
  </g>
  <g class="draw d3">
