<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <style>
    .draw { opacity: 0; animation: appear 0.35s ease forwards; }
    .d2 { animation-delay: 0.28s; }
    .d3 { animation-delay: 0.56s; }
    .d4 { animation-delay: 0.84s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="220" fill="#f6f1e7" />
  <g class="draw">
    <rect x="20" y="48" width="150" height="110" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5" />
    <text x="95" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">preprocessor</text>
    <text x="95" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">#include, macros</text>
  </g>
  <g class="draw d2">
    <rect x="206" y="48" width="150" height="110" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5" />
    <text x="281" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">compiler</text>
    <text x="281" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">one <tspan direction="ltr">.cpp</tspan> file to <tspan direction="ltr">asm</tspan></text>
  </g>
  <g class="draw d3">
    <rect x="392" y="48" width="150" height="110" rx="12" fill="#e8f0f8" stroke="#c5d6e8" stroke-width="1.5" />
    <text x="467" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">assembler</text>
    <text x="467" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">writes a <tspan direction="ltr">.o</tspan> file</text>
  </g>
  <g class="draw d4">
    <rect x="578" y="48" width="160" height="110" rx="12" fill="#d4e4f4" stroke="#a8c4dc" stroke-width="1.5" />
    <text x="658" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">linker</text>
    <text x="658" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">finds <tspan direction="ltr">main</tspan></text>
    <text x="658" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">one executable</text>
  </g>
  <g class="draw d2">
    <polygon points="198,103 184,96 184,110" fill="#3d7eb8" />
  </g>
  <g class="draw d3">
    <polygon points="384,103 370,96 370,110" fill="#3d7eb8" />
  </g>
  <g class="draw d4">
    <polygon points="570,103 556,96 556,110" fill="#3d7eb8" />
  </g>
</svg>
