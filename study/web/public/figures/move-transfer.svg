    <text x="173" y="108" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="14" fill="var(--fig-ink-soft, currentColor)">_bytes</text>
    <line x1="173" y1="126" x2="173" y2="150" stroke="var(--fig-accent, currentColor)" stroke-width="2" />
    <polygon points="173,158 167,146 179,146" fill="var(--fig-accent, currentColor)" />
    <rect x="88" y="150" width="170" height="52" rx="10" fill="var(--fig-fill-2, none)" stroke="var(--fig-fill-2-rule, currentColor)" stroke-width="1.5" />
