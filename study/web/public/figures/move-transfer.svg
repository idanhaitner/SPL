    <text x="475" y="86" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="15" font-weight="650" fill="var(--fig-ink, currentColor)" direction="ltr">source</text>
    <text x="475" y="108" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="13" fill="var(--fig-ink-soft, currentColor)">_bytes = nullptr</text>
    <rect x="566" y="56" width="150" height="70" rx="12" fill="var(--fig-accent-fill-2, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
