    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="340" fill="#f6f1e7"/>
  <text x="190" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#8a5a22">בתוך leaky</text>
  <text x="570" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#8a5a22">אחרי ש-leaky חוזרת</text>
  <g class="draw">
    <rect x="28" y="64" width="324" height="100" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
