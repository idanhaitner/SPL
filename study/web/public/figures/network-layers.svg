<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
  <style>
    .draw { opacity: 0; animation: appear 0.35s ease forwards; }
    .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.5s; }
    .d4 { animation-delay: 0.75s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="640" height="340" fill="#f6f1e7" />
  <g class="draw">
    <rect x="80" y="24" width="480" height="64" rx="12" fill="#d4e4f4" stroke="#a8c4dc" stroke-width="1.5" />
    <text x="320" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">application layer</text>
    <text x="320" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">the message, e.g. an <tspan direction="ltr">echo</tspan> line</text>
  </g>
  <g class="draw d2">
    <rect x="80" y="100" width="480" height="64" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5" />
    <text x="320" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">transport layer</text>
    <text x="320" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">port to port, <tspan direction="ltr">TCP</tspan> or <tspan direction="ltr">UDP</tspan></text>
  </g>
  <g class="draw d3">
    <rect x="80" y="176" width="480" height="64" rx="12" fill="#e7eef6" stroke="#c9d7e4" stroke-width="1.5" />
    <text x="320" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">internet layer</text>
    <text x="320" y="224" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">from <tspan direction="ltr">IP</tspan> address to <tspan direction="ltr">IP</tspan> address</text>
  </g>
  <g class="draw d4">
    <rect x="80" y="252" width="480" height="64" rx="12" fill="#e7f0e4" stroke="#c9dcc4" stroke-width="1.5" />
    <text x="320" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" direction="ltr">link layer</text>
    <text x="320" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="ltr">frames on the wire</text>
  </g>
</svg>
