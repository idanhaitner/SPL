<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
  <g>
    <rect x="80" y="24" width="480" height="64" rx="12" fill="var(--fig-accent-fill-2, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
    <text x="320" y="52" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" direction="ltr">application layer</text>
    <text x="320" y="72" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr">the message, e.g. an <tspan direction="ltr">echo</tspan> line</text>
  </g>
  <g>
    <rect x="80" y="100" width="480" height="64" rx="12" fill="var(--fig-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="320" y="128" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" direction="ltr">transport layer</text>
    <text x="320" y="148" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr">port to port, <tspan direction="ltr">TCP</tspan> or <tspan direction="ltr">UDP</tspan></text>
  </g>
  <g>
    <rect x="80" y="176" width="480" height="64" rx="12" fill="var(--fig-accent-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="320" y="204" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" direction="ltr">internet layer</text>
    <text x="320" y="224" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr">from <tspan direction="ltr">IP</tspan> address to <tspan direction="ltr">IP</tspan> address</text>
  </g>
  <g>
    <rect x="80" y="252" width="480" height="64" rx="12" fill="var(--fig-fill-2, none)" stroke="var(--fig-fill-2-rule, currentColor)" stroke-width="1.5" />
    <text x="320" y="280" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" direction="ltr">link layer</text>
    <text x="320" y="300" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr">frames on the wire</text>
  </g>
</svg>
