  <text x="52" y="112" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">grows and shrinks, released on return</text>
  <rect x="36" y="148" width="608" height="84" rx="12" fill="var(--fig-fill-2, none)" stroke="var(--fig-fill-2-rule, currentColor)" stroke-width="1.5" />
