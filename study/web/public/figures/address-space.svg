  <text x="52" y="308" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348" text-anchor="start" direction="ltr">fixed for the whole run</text>
  <rect x="36" y="340" width="608" height="72" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5" />
