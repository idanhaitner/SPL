<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" width="760" height="860">
  <rect width="760" height="860" fill="#f6f1e7"/>
  <rect x="28" y="20" width="704" height="356" rx="18" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
  <text x="52" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#8a5a22" letter-spacing="1.4">CPU</text>
  <rect x="52" y="70" width="316" height="86" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
  <text x="210" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#2a3142">Control unit</text>
  <text x="210" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">fetch, decode, execute</text>
  <rect x="384" y="70" width="316" height="86" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
  <text x="542" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#2a3142">ALU</text>
  <text x="542" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">arithmetic and compare</text>
  <rect x="52" y="172" width="316" height="86" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
  <text x="210" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#2a3142">Registers</text>
  <text x="210" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">ip, general, rsp</text>
  <rect x="384" y="172" width="316" height="86" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
  <text x="542" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#2a3142">Clock</text>
  <text x="542" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">steps per second</text>
  <rect x="52" y="274" width="648" height="76" rx="12" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
  <text x="376" y="306" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#2a3142">Cache</text>
  <text x="376" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">between the registers and RAM</text>
  <line x1="380" y1="392" x2="380" y2="428" stroke="#c47b2b" stroke-width="2"/>
  <polygon points="380,436 374,424 386,424" fill="#c47b2b"/>
  <text x="396" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8a5a22">bus</text>
  <rect x="150" y="448" width="460" height="78" rx="14" fill="#e7f0e4" stroke="#c9dcc4" stroke-width="1.5"/>
  <text x="380" y="480" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#2a3142">RAM</text>
  <text x="380" y="504" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">program and data share this memory</text>
  <text x="380" y="572" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#8a5a22">Fastest and smallest at the top</text>
  <rect x="280" y="592" width="200" height="40" rx="10" fill="#c47b2b"/>
  <text x="380" y="618" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#fffdf8">Registers</text>
  <rect x="230" y="644" width="300" height="40" rx="10" fill="#d4923f"/>
  <text x="380" y="670" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#fffdf8">L1 cache</text>
  <rect x="180" y="696" width="400" height="40" rx="10" fill="#e0ad62"/>
  <text x="380" y="722" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">L2 cache</text>
  <rect x="130" y="748" width="500" height="40" rx="10" fill="#edd4a4"/>
  <text x="380" y="774" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">L3 cache</text>
  <rect x="70" y="800" width="620" height="40" rx="10" fill="#e7f0e4" stroke="#c9dcc4" stroke-width="1.5"/>
  <text x="380" y="826" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">RAM</text>
</svg>
