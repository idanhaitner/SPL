<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" width="760" height="860">
  <rect width="760" height="860" fill="#f6f8fb" />
  <rect x="28" y="20" width="704" height="356" rx="18" fill="#fdfeff" stroke="#d2dae5" stroke-width="1.5" />
  <text x="52" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#1d4fa8" letter-spacing="1.4">CPU</text>
  <rect x="52" y="70" width="316" height="86" rx="12" fill="#e8f0fc" stroke="#bcd0f0" stroke-width="1.5" />
  <text x="210" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#1b2333" direction="ltr">control unit</text>
  <text x="210" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4b5565" direction="ltr">fetch, decode, execute</text>
  <rect x="384" y="70" width="316" height="86" rx="12" fill="#e8f0fc" stroke="#bcd0f0" stroke-width="1.5" />
  <text x="542" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#1b2333">ALU</text>
  <text x="542" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4b5565" direction="ltr">arithmetic and compare</text>
  <rect x="52" y="172" width="316" height="86" rx="12" fill="#e8f0fc" stroke="#bcd0f0" stroke-width="1.5" />
  <text x="210" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#1b2333" direction="ltr">registers</text>
  <text x="210" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4b5565">ip, general, rsp</text>
  <rect x="384" y="172" width="316" height="86" rx="12" fill="#e8f0fc" stroke="#bcd0f0" stroke-width="1.5" />
  <text x="542" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#1b2333" direction="ltr">clock</text>
  <text x="542" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4b5565" direction="ltr">steps per second</text>
  <rect x="52" y="274" width="648" height="76" rx="12" fill="#d0e0f8" stroke="#9dbdec" stroke-width="1.5" />
  <text x="376" y="306" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#1b2333" direction="ltr">cache</text>
  <text x="376" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4b5565" direction="ltr">between registers and <tspan direction="ltr">RAM</tspan></text>
  <line x1="380" y1="392" x2="380" y2="428" stroke="#1f63d2" stroke-width="2" />
  <polygon points="380,436 374,424 386,424" fill="#1f63d2" />
  <text x="396" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1d4fa8">bus</text>
  <rect x="150" y="448" width="460" height="78" rx="14" fill="#e6f3ec" stroke="#bcdccb" stroke-width="1.5" />
  <text x="380" y="480" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" fill="#1b2333">RAM</text>
  <text x="380" y="504" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4b5565" direction="ltr">program and data share memory</text>
  <text x="380" y="572" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#1d4fa8" direction="ltr">fastest and smallest at the top</text>
  <rect x="280" y="592" width="200" height="40" rx="10" fill="#1f63d2" />
  <text x="380" y="618" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#fdfeff" direction="ltr">registers</text>
  <rect x="230" y="644" width="300" height="40" rx="10" fill="#1f63d2" />
  <text x="380" y="670" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#fdfeff" direction="ltr"><tspan direction="ltr">L1</tspan> cache</text>
  <rect x="180" y="696" width="400" height="40" rx="10" fill="#9dbdec" />
  <text x="380" y="722" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#1b2333" direction="ltr"><tspan direction="ltr">L2</tspan> cache</text>
  <rect x="130" y="748" width="500" height="40" rx="10" fill="#d0e0f8" />
  <text x="380" y="774" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#1b2333" direction="ltr"><tspan direction="ltr">L3</tspan> cache</text>
  <rect x="70" y="800" width="620" height="40" rx="10" fill="#e6f3ec" stroke="#bcdccb" stroke-width="1.5" />
  <text x="380" y="826" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#1b2333">RAM</text>
</svg>
