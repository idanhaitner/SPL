<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
  <g>
    <text x="180" y="36" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="14" font-weight="650" fill="var(--fig-accent, currentColor)" direction="ltr">shallow copy</text>
    <rect x="36" y="52" width="140" height="72" rx="10" fill="var(--fig-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="106" y="84" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="15" font-weight="650" fill="var(--fig-ink, currentColor)">Image a</text>
    <text x="106" y="106" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="13" fill="var(--fig-ink-soft, currentColor)">_bytes</text>
    <rect x="196" y="52" width="140" height="72" rx="10" fill="var(--fig-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="266" y="84" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="15" font-weight="650" fill="var(--fig-ink, currentColor)">Image b</text>
    <text x="266" y="106" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="13" fill="var(--fig-ink-soft, currentColor)">_bytes</text>
    <rect x="96" y="168" width="180" height="56" rx="10" fill="var(--fig-fill-2, none)" stroke="var(--fig-fill-2-rule, currentColor)" stroke-width="1.5" />
    <text x="186" y="202" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink, currentColor)" direction="ltr">one byte buffer</text>
    <line x1="106" y1="124" x2="150" y2="168" stroke="var(--fig-accent, currentColor)" stroke-width="2" />
    <line x1="266" y1="124" x2="220" y2="168" stroke="var(--fig-accent, currentColor)" stroke-width="2" />
    <text x="186" y="256" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr"><tspan direction="ltr">b</tspan>'s destructor frees</text>
    <text x="186" y="276" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr"><tspan direction="ltr">a</tspan> is left dangling</text>
  </g>
  <g>
    <text x="560" y="36" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="14" font-weight="650" fill="var(--fig-accent, currentColor)" direction="ltr">deep copy</text>
    <rect x="420" y="52" width="140" height="72" rx="10" fill="var(--fig-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="490" y="94" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="15" font-weight="650" fill="var(--fig-ink, currentColor)">Image a</text>
    <rect x="580" y="52" width="140" height="72" rx="10" fill="var(--fig-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="650" y="94" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="15" font-weight="650" fill="var(--fig-ink, currentColor)">Image b</text>
    <rect x="420" y="168" width="140" height="56" rx="10" fill="var(--fig-fill-2, none)" stroke="var(--fig-fill-2-rule, currentColor)" stroke-width="1.5" />
    <text x="490" y="202" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink, currentColor)" direction="ltr"><tspan direction="ltr">a</tspan>'s buffer</text>
    <rect x="580" y="168" width="140" height="56" rx="10" fill="var(--fig-accent-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="650" y="202" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink, currentColor)" direction="ltr"><tspan direction="ltr">b</tspan>'s buffer</text>
    <line x1="490" y1="124" x2="490" y2="168" stroke="var(--fig-accent, currentColor)" stroke-width="2" />
    <line x1="650" y1="124" x2="650" y2="168" stroke="var(--fig-accent, currentColor)" stroke-width="2" />
    <text x="560" y="260" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr">each destructor frees</text>
    <text x="560" y="280" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" direction="ltr">only its own buffer</text>
  </g>
