<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260">
  <style>
    .draw { opacity: 0; animation: appear 0.4s ease forwards; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.7s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="260" fill="#f6f8fb" />
  <g class="draw">
    <rect x="48" y="88" width="160" height="88" rx="12" fill="#e8f0fc" stroke="#bcd0f0" stroke-width="1.5" />
    <text x="128" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#1b2333">x</text>
    <text x="128" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" direction="ltr">address 16</text>
    <rect x="228" y="88" width="160" height="88" rx="12" fill="#fdfeff" stroke="#d2dae5" stroke-width="1.5" />
    <text x="308" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#1b2333" direction="ltr">next <tspan direction="ltr">int</tspan></text>
    <text x="308" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" direction="ltr">address 20</text>
    <rect x="408" y="88" width="160" height="88" rx="12" fill="#fdfeff" stroke="#d2dae5" stroke-width="1.5" />
    <text x="488" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#1b2333" direction="ltr">the one after</text>
    <text x="488" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" direction="ltr">address 24</text>
  </g>
  <g class="draw d2">
    <text x="128" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#1d4fa8">px</text>
    <line x1="128" y1="192" x2="128" y2="176" stroke="#1f63d2" stroke-width="2" />
    <polygon points="128,176 122,188 134,188" fill="#1f63d2" />
  </g>
  <g class="draw d3">
    <text x="308" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#1d4fa8">px + 1</text>
    <line x1="308" y1="220" x2="308" y2="176" stroke="#1f63d2" stroke-width="2" />
    <polygon points="308,176 302,188 314,188" fill="#1f63d2" />
    <text x="590" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" text-anchor="start" direction="ltr">the step is</text>
    <text x="590" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" text-anchor="start" direction="ltr">4 bytes</text>
  </g>
</svg>
