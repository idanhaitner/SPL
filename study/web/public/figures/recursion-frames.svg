<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <style>
    .draw { opacity: 0; animation: appear 0.4s ease forwards; }
    .d2 { animation-delay: 0.3s; }
    .d3 { animation-delay: 0.6s; }
    .d4 { animation-delay: 0.9s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="720" height="420" fill="#f6f8fb" />
  <text x="36" y="32" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#1d4fa8" direction="ltr">high addresses</text>
  <g class="draw">
    <rect x="36" y="48" width="520" height="72" rx="12" fill="#e8f0fc" stroke="#bcd0f0" stroke-width="1.5" />
    <text x="52" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2333" text-anchor="start">main</text>
    <text x="52" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" text-anchor="start" direction="ltr">waits for the first call</text>
  </g>
  <g class="draw d2">
    <rect x="36" y="132" width="520" height="72" rx="12" fill="#d0e0f8" stroke="#9dbdec" stroke-width="1.5" />
    <text x="52" y="162" font-family="ui-monospace, monospace" font-size="15" fill="#1b2333" text-anchor="start">forever  n = 0, pad[256]</text>
    <text x="52" y="186" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" text-anchor="start" direction="ltr">return address to <tspan direction="ltr">main</tspan></text>
  </g>
  <g class="draw d3">
    <rect x="36" y="216" width="520" height="72" rx="12" fill="#d0e0f8" stroke="#9dbdec" stroke-width="1.5" />
    <text x="52" y="246" font-family="ui-monospace, monospace" font-size="15" fill="#1b2333" text-anchor="start">forever  n = 1, pad[256]</text>
    <text x="52" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" text-anchor="start" direction="ltr">another full frame, not reused</text>
  </g>
  <g class="draw d4">
    <rect x="36" y="300" width="520" height="72" rx="12" fill="#f6e4dc" stroke="#e0b8a8" stroke-width="1.5" />
    <text x="52" y="330" font-family="ui-monospace, monospace" font-size="15" fill="#1b2333" text-anchor="start">forever  n = 2, pad[256]</text>
    <text x="52" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4b5565" text-anchor="start" direction="ltr">continues until the stack is full</text>
  </g>
  <text x="580" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#1d4fa8" text-anchor="start" direction="ltr">grows</text>
  <text x="580" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#1d4fa8" text-anchor="start" direction="ltr">down</text>
  <text x="36" y="400" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#1d4fa8" direction="ltr">low addresses</text>
</svg>
