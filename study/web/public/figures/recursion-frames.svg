<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <text x="36" y="32" text-anchor="start" font-family="var(--gh-body, sans-serif)" font-size="13" font-weight="650" fill="var(--fig-accent, currentColor)" direction="ltr">high addresses</text>
  <g>
    <rect x="36" y="48" width="520" height="72" rx="12" fill="var(--fig-accent-fill, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
    <text x="52" y="78" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" text-anchor="start">main</text>
    <text x="52" y="102" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">waits for the first call</text>
  </g>
  <g>
    <rect x="36" y="132" width="520" height="72" rx="12" fill="var(--fig-accent-fill-2, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
    <text x="52" y="162" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)" text-anchor="start">forever  n = 0, pad[256]</text>
    <text x="52" y="186" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">return address to <tspan direction="ltr">main</tspan></text>
  </g>
  <g>
    <rect x="36" y="216" width="520" height="72" rx="12" fill="var(--fig-accent-fill-2, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
    <text x="52" y="246" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)" text-anchor="start">forever  n = 1, pad[256]</text>
    <text x="52" y="270" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">another full frame, not reused</text>
  </g>
  <g>
    <rect x="36" y="300" width="520" height="72" rx="12" fill="var(--fig-danger-fill, none)" stroke="var(--fig-danger, currentColor)" stroke-width="1.5" />
    <text x="52" y="330" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)" text-anchor="start">forever  n = 2, pad[256]</text>
    <text x="52" y="354" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">continues until the stack is full</text>
  </g>
  <text x="580" y="250" font-family="var(--gh-body, sans-serif)" font-size="14" font-weight="650" fill="var(--fig-accent, currentColor)" text-anchor="start" direction="ltr">grows</text>
  <text x="580" y="272" font-family="var(--gh-body, sans-serif)" font-size="14" font-weight="650" fill="var(--fig-accent, currentColor)" text-anchor="start" direction="ltr">down</text>
  <text x="36" y="400" text-anchor="start" font-family="var(--gh-body, sans-serif)" font-size="13" font-weight="650" fill="var(--fig-accent, currentColor)" direction="ltr">low addresses</text>
</svg>
