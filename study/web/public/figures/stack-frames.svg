<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460">
  <rect width="780" height="460" fill="#f6f1e7" />
  <text x="200" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2f5f8a" direction="ltr">while <tspan direction="ltr">foo</tspan> runs</text>
  <text x="580" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2f5f8a" direction="ltr">after <tspan direction="ltr">foo</tspan> returns</text>
  <g class="draw">
    <text x="36" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#2f5f8a" text-anchor="start" direction="ltr">high addresses</text>
    <rect x="36" y="80" width="328" height="92" rx="12" fill="#e8f0f8" stroke="#c5d6e8" stroke-width="1.5" />
    <text x="52" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr"><tspan direction="ltr">main</tspan>'s frame</text>
    <text x="52" y="136" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start">a = 4</text>
    <text x="52" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">stays for the call</text>
    <rect x="36" y="184" width="328" height="168" rx="12" fill="#d4e4f4" stroke="#a8c4dc" stroke-width="1.5" />
    <text x="52" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr"><tspan direction="ltr">foo</tspan>'s frame</text>
    <text x="52" y="242" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start" direction="ltr">return address</text>
    <text x="52" y="268" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start">n = 4</text>
    <text x="140" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">parameter</text>
    <text x="52" y="294" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start">x = 8</text>
    <text x="140" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">local</text>
    <text x="52" y="328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">pushed on call <tspan direction="ltr">foo(a)</tspan></text>
    <text x="36" y="376" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#2f5f8a" text-anchor="start" direction="ltr">low addresses</text>
  </g>
  <g class="draw d2">
    <text x="416" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#2f5f8a" text-anchor="start" direction="ltr">high addresses</text>
    <rect x="416" y="80" width="328" height="92" rx="12" fill="#e8f0f8" stroke="#c5d6e8" stroke-width="1.5" />
    <text x="432" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr"><tspan direction="ltr">main</tspan>'s frame</text>
    <text x="432" y="136" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start">a = 4</text>
    <text x="432" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">still here</text>
    <rect x="416" y="184" width="328" height="168" rx="12" fill="none" stroke="#b7ab9c" stroke-width="1.5" stroke-dasharray="7 6" />
    <text x="432" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr"><tspan direction="ltr">foo</tspan>'s frame is gone</text>
    <text x="432" y="258" font-family="ui-monospace, monospace" font-size="15" fill="#5c5348" text-anchor="start" direction="ltr"><tspan direction="ltr">n</tspan> does not exist</text>
    <text x="432" y="284" font-family="ui-monospace, monospace" font-size="15" fill="#5c5348" text-anchor="start" direction="ltr"><tspan direction="ltr">x</tspan> does not exist</text>
    <text x="432" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">return popped the frame</text>
    <text x="416" y="376" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#2f5f8a" text-anchor="start" direction="ltr">low addresses</text>
  </g>
  <text class="draw d3" x="390" y="428" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348" direction="ltr">A <tspan direction="ltr">new</tspan> inside <tspan direction="ltr">foo</tspan> would leave the block on the heap. The pointer to it would not remain in the frame.</text>
</svg>
