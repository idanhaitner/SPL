    <rect x="200" y="176" width="150" height="64" rx="10" fill="var(--fig-accent-fill, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
    <text x="275" y="214" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)">benni → B</text>
    <rect x="374" y="176" width="150" height="64" rx="10" fill="var(--fig-accent-fill-2, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
    <text x="449" y="214" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)">temp → B2</text>
