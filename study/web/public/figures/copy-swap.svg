    <text x="628" y="204" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="14" fill="var(--fig-ink, currentColor)">A   B   B2</text>
    <text x="628" y="224" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="12" fill="var(--fig-ink-soft, currentColor)" direction="ltr">three buffers</text>
  </g>
  <g>
    <text x="36" y="292" font-family="var(--gh-body, sans-serif)" font-size="14" font-weight="650" fill="var(--fig-accent, currentColor)" text-anchor="start" direction="ltr">3. <tspan direction="ltr">swap</tspan>, then <tspan direction="ltr">temp</tspan>'s destructor frees <tspan direction="ltr">A</tspan></text>
    <rect x="36" y="304" width="150" height="64" rx="10" fill="var(--fig-accent-fill, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
