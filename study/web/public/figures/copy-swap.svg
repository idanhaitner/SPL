    <text x="281" y="342" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)">benni → B</text>
    <rect x="376" y="304" width="160" height="64" rx="10" fill="var(--fig-danger-fill, none)" stroke="var(--fig-danger, currentColor)" stroke-width="1.5" />
    <text x="456" y="332" text-anchor="middle" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)">temp → A</text>
    <text x="456" y="352" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="12" fill="var(--fig-ink-soft, currentColor)">delete[] A</text>
    <text x="36" y="412" font-family="var(--gh-body, sans-serif)" font-size="14" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr"><tspan direction="ltr">benni</tspan> still holds <tspan direction="ltr">B</tspan>. <tspan direction="ltr">avi</tspan> holds the copy. No sharing.</text>
  </g>
