  </g>
  <g>
    <text x="36" y="164" font-family="var(--gh-body, sans-serif)" font-size="14" font-weight="650" fill="var(--fig-accent, currentColor)" text-anchor="start" direction="ltr">2. <tspan direction="ltr">temp</tspan> deep-copies <tspan direction="ltr">B</tspan> into buffer <tspan direction="ltr">B2</tspan></text>
    <rect x="36" y="176" width="140" height="64" rx="10" fill="var(--fig-accent-fill, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
