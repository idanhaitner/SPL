<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <style>
    .draw { opacity: 0; animation: appear 0.45s ease forwards; }
    .d2 { animation-delay: 0.4s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="300" fill="#f6f1e7" />
  <text x="190" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2f5f8a" direction="ltr">first call, on return</text>
  <text x="570" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2f5f8a" direction="ltr">second call, on entry</text>
  <g class="draw">
    <rect x="28" y="56" width="324" height="96" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5" />
    <text x="44" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr"><tspan direction="ltr">static</tspan> area</text>
    <text x="44" y="116" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start">c = 1</text>
    <text x="120" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">initialized once, kept</text>
    <rect x="28" y="168" width="324" height="96" rx="12" fill="none" stroke="#b7ab9c" stroke-width="1.5" stroke-dasharray="7 6" />
    <text x="44" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr">stack</text>
    <text x="44" y="236" font-family="ui-monospace, monospace" font-size="15" fill="#5c5348" text-anchor="start" direction="ltr"><tspan direction="ltr">x</tspan> is already gone</text>
  </g>
  <g class="draw d2">
    <rect x="408" y="56" width="324" height="96" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5" />
    <text x="424" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr"><tspan direction="ltr">static</tspan> area</text>
    <text x="424" y="116" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start">c = 1</text>
    <text x="500" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">not reset to 0</text>
    <rect x="408" y="168" width="324" height="96" rx="12" fill="#e8f0f8" stroke="#c5d6e8" stroke-width="1.5" />
    <text x="424" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="ltr">stack, new frame</text>
    <text x="424" y="228" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start">x = 1</text>
    <text x="500" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="ltr">new local</text>
  </g>
</svg>
