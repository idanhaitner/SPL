<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <text x="190" y="34" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="15" font-weight="650" fill="var(--fig-accent, currentColor)" direction="ltr">first call, on return</text>
  <text x="570" y="34" text-anchor="middle" font-family="var(--gh-body, sans-serif)" font-size="15" font-weight="650" fill="var(--fig-accent, currentColor)" direction="ltr">second call, on entry</text>
  <g>
    <rect x="28" y="56" width="324" height="96" rx="12" fill="var(--fig-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="44" y="88" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" text-anchor="start" direction="ltr"><tspan direction="ltr">static</tspan> area</text>
    <text x="44" y="116" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)" text-anchor="start">c = 1</text>
    <text x="120" y="116" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">initialized once, kept</text>
    <rect x="28" y="168" width="324" height="96" rx="12" fill="none" stroke="var(--fig-ink-soft, currentColor)" stroke-width="1.5" stroke-dasharray="7 6" />
    <text x="44" y="208" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" text-anchor="start" direction="ltr">stack</text>
    <text x="44" y="236" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr"><tspan direction="ltr">x</tspan> is already gone</text>
  </g>
  <g>
    <rect x="408" y="56" width="324" height="96" rx="12" fill="var(--fig-fill, none)" stroke="var(--fig-rule, currentColor)" stroke-width="1.5" />
    <text x="424" y="88" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" text-anchor="start" direction="ltr"><tspan direction="ltr">static</tspan> area</text>
    <text x="424" y="116" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)" text-anchor="start">c = 1</text>
    <text x="500" y="116" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">not reset to 0</text>
    <rect x="408" y="168" width="324" height="96" rx="12" fill="var(--fig-accent-fill, none)" stroke="var(--fig-accent-rule, currentColor)" stroke-width="1.5" />
    <text x="424" y="200" font-family="var(--gh-body, sans-serif)" font-size="16" font-weight="650" fill="var(--fig-ink, currentColor)" text-anchor="start" direction="ltr">stack, new frame</text>
    <text x="424" y="228" font-family="var(--gh-mono, monospace)" font-size="15" fill="var(--fig-ink, currentColor)" text-anchor="start">x = 1</text>
    <text x="500" y="228" font-family="var(--gh-body, sans-serif)" font-size="13" fill="var(--fig-ink-soft, currentColor)" text-anchor="start" direction="ltr">new local</text>
  </g>
</svg>
