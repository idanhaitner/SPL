<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
  <style>
    .draw { opacity: 0; animation: appear 0.4s ease forwards; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.7s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="640" height="340" fill="#f6f1e7"/>
  <text x="600" y="36" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#8a5a22">high addresses</text>
  <g class="draw">
    <rect x="48" y="52" width="544" height="88" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
    <text x="72" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">main's frame</text>
    <text x="72" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">still here while foo runs</text>
  </g>
  <g class="draw d2">
    <rect x="48" y="152" width="544" height="100" rx="12" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
    <text x="72" y="186" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">foo's frame</text>
    <text x="72" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">parameter n, local x, return address</text>
    <text x="72" y="234" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">pushed on the call, popped on return</text>
  </g>
  <text class="draw d3" x="600" y="312" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#8a5a22">low addresses</text>
</svg>
