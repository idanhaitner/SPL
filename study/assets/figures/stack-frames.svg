<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460">
  <style>
    .draw { opacity: 0; animation: appear 0.45s ease forwards; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.7s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="780" height="460" fill="#f6f1e7" />
  <text x="200" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#8a5a22" direction="rtl" unicode-bidi="embed">בזמן ש-<tspan direction="ltr" unicode-bidi="embed">foo</tspan> רץ</text>
  <text x="580" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#8a5a22" direction="rtl" unicode-bidi="embed">אחרי ש-<tspan direction="ltr" unicode-bidi="embed">foo</tspan> חוזר</text>
  <g class="draw">
    <text x="352" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#8a5a22" text-anchor="start" direction="rtl" unicode-bidi="embed">כתובות גבוהות</text>
    <rect x="36" y="80" width="328" height="92" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5" />
    <text x="344" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">המסגרת של <tspan direction="ltr" unicode-bidi="embed">main</tspan></text>
    <text x="344" y="136" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="end">a = 4</text>
    <text x="344" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">נשאר לכל הקריאה</text>
    <rect x="36" y="184" width="328" height="168" rx="12" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5" />
    <text x="344" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">המסגרת של <tspan direction="ltr" unicode-bidi="embed">foo</tspan></text>
    <text x="344" y="242" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">כתובת חזרה</text>
    <text x="344" y="268" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="end">n = 4</text>
    <text x="200" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">הפרמטר</text>
    <text x="344" y="294" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="end">x = 8</text>
    <text x="200" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">המקומי</text>
    <text x="344" y="328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">נדחף בקריאה <tspan direction="ltr" unicode-bidi="embed">foo(a)</tspan></text>
    <text x="352" y="376" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#8a5a22" text-anchor="start" direction="rtl" unicode-bidi="embed">כתובות נמוכות</text>
  </g>
  <g class="draw d2">
    <text x="732" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#8a5a22" text-anchor="start" direction="rtl" unicode-bidi="embed">כתובות גבוהות</text>
    <rect x="416" y="80" width="328" height="92" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5" />
    <text x="724" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">המסגרת של <tspan direction="ltr" unicode-bidi="embed">main</tspan></text>
    <text x="724" y="136" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="end">a = 4</text>
    <text x="724" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">עדיין כאן</text>
    <rect x="416" y="184" width="328" height="168" rx="12" fill="none" stroke="#b7ab9c" stroke-width="1.5" stroke-dasharray="7 6" />
    <text x="724" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">המסגרת של <tspan direction="ltr" unicode-bidi="embed">foo</tspan> נעלמה</text>
    <text x="724" y="258" font-family="ui-monospace, monospace" font-size="15" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">‏<tspan direction="ltr" unicode-bidi="embed">n</tspan> לא קיים</text>
    <text x="724" y="284" font-family="ui-monospace, monospace" font-size="15" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">‏<tspan direction="ltr" unicode-bidi="embed">x</tspan> לא קיים</text>
    <text x="724" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">החזרה שלפה את המסגרת</text>
    <text x="732" y="376" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#8a5a22" text-anchor="start" direction="rtl" unicode-bidi="embed">כתובות נמוכות</text>
  </g>
  <text class="draw d3" x="390" y="428" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348" direction="rtl" unicode-bidi="embed">‏<tspan direction="ltr" unicode-bidi="embed">new</tspan> בתוך <tspan direction="ltr" unicode-bidi="embed">foo</tspan> היה משאיר את הבלוק בערימה. המצביע אליו במסגרת לא היה נשאר.</text>
</svg>
