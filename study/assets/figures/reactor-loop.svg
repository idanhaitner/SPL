<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <rect width="760" height="420" fill="#f6f1e7"/>
  <rect x="24" y="24" width="328" height="372" rx="16" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
  <text x="48" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#8a5a22">one thread</text>
  <text x="48" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650" fill="#2a3142">Selector</text>
  <circle cx="64" cy="128" r="14" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
  <text x="64" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a3142">1</text>
  <text x="92" y="124" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142">select()</text>
  <text x="92" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">wait until a key is ready</text>
  <circle cx="64" cy="196" r="14" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
  <text x="64" y="201" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a3142">2</text>
  <text x="92" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">Ready keys</text>
  <text x="92" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">remove each key from the set</text>
  <circle cx="64" cy="264" r="14" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
  <text x="64" y="269" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a3142">3</text>
  <text x="92" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">Handle the key</text>
  <text x="92" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">accept, read, or write</text>
  <rect x="44" y="324" width="90" height="40" rx="10" fill="#e7eef6" stroke="#c9d7e4" stroke-width="1.5"/>
  <text x="89" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a3142">accept</text>
  <rect x="144" y="324" width="90" height="40" rx="10" fill="#e7eef6" stroke="#c9d7e4" stroke-width="1.5"/>
  <text x="189" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a3142">read</text>
  <rect x="244" y="324" width="90" height="40" rx="10" fill="#e7eef6" stroke="#c9d7e4" stroke-width="1.5"/>
  <text x="289" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a3142">write</text>
  <line x1="368" y1="168" x2="448" y2="168" stroke="#c47b2b" stroke-width="2"/>
  <polygon points="456,168 442,162 442,174" fill="#c47b2b"/>
  <text x="412" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8a5a22">full message</text>
  <line x1="456" y1="300" x2="376" y2="300" stroke="#c47b2b" stroke-width="2"/>
  <polygon points="368,300 382,294 382,306" fill="#c47b2b"/>
  <text x="412" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8a5a22">queued bytes</text>
  <rect x="472" y="72" width="264" height="200" rx="16" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
  <text x="496" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#8a5a22">off this thread</text>
  <text x="496" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650" fill="#2a3142">Protocol pool</text>
  <text x="496" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3d4454">one task per client</text>
  <text x="496" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3d4454">protocol work only</text>
  <text x="496" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">the selector stays free</text>
</svg>
