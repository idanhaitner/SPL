    <text x="186" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" direction="rtl" unicode-bidi="embed">‏<tspan direction="ltr" unicode-bidi="embed">a</tspan> נשאר תלוי</text>
  </g>
  <g class="draw d2">
    <text x="560" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#8a5a22" direction="rtl" unicode-bidi="embed">העתקה עמוקה</text>
    <rect x="420" y="52" width="140" height="72" rx="10" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5" />
    <text x="490" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">Image a</text>
