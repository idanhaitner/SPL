<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280">
  <style>
    .draw { opacity: 0; animation: appear 0.4s ease forwards; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.7s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="280" fill="#f6f1e7"/>
  <g class="draw">
    <rect x="24" y="36" width="200" height="150" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
    <text x="124" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">Students</text>
    <text x="124" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2a3142">Alice</text>
    <text x="124" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2a3142">Bob</text>
    <text x="124" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">no course column</text>
  </g>
  <g class="draw d2">
    <rect x="280" y="36" width="200" height="110" rx="12" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
    <text x="380" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">StudentsCourses</text>
    <text x="380" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2a3142">Alice, prog</text>
    <text x="380" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348">Bob has no row</text>
  </g>
  <g class="draw d3">
    <rect x="536" y="36" width="200" height="150" rx="12" fill="#e7eef6" stroke="#c9d7e4" stroke-width="1.5"/>
    <text x="636" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">Courses</text>
    <text x="636" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2a3142">prog</text>
    <text x="636" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2a3142">systems</text>
    <text x="380" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">inner join keeps Alice and prog</text>
    <text x="380" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">Bob and systems drop out</text>
  </g>
</svg>
