<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560">
  <rect width="680" height="560" fill="#f6f1e7"/>
  <text x="640" y="36" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#8a5a22">high addresses</text>
  <rect x="36" y="52" width="608" height="84" rx="12" fill="#f8ecd9" stroke="#e2d0b0" stroke-width="1.5"/>
  <text x="60" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">Stack</text>
  <text x="60" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">grows and shrinks, freed on return</text>
  <rect x="36" y="148" width="608" height="84" rx="12" fill="#e7f0e4" stroke="#c9dcc4" stroke-width="1.5"/>
  <text x="60" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">Heap</text>
  <text x="60" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">grows and shrinks, freed with delete</text>
  <rect x="36" y="256" width="608" height="72" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
  <text x="60" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">Uninitialized statics</text>
  <text x="60" y="308" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">fixed for the whole run</text>
  <rect x="36" y="340" width="608" height="72" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
  <text x="60" y="370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">Initialized statics</text>
  <text x="60" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">fixed for the whole run</text>
  <rect x="36" y="424" width="608" height="72" rx="12" fill="#e7eef6" stroke="#c9d7e4" stroke-width="1.5"/>
  <text x="60" y="454" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#2a3142">Code</text>
  <text x="60" y="476" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">fixed, read only</text>
  <text x="640" y="532" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#8a5a22">low addresses</text>
</svg>
