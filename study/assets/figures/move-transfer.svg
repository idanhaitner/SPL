<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250">
  <style>
    .draw { opacity: 0; animation: appear 0.4s ease forwards; }
    .d2 { animation-delay: 0.55s; }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="250" fill="#f6f1e7"/>
  <g class="draw">
    <text x="180" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#8a5a22">before the move</text>
    <rect x="48" y="56" width="250" height="70" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
    <text x="173" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142">source Image</text>
    <text x="173" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#5c5348">_bytes</text>
    <line x1="173" y1="126" x2="173" y2="150" stroke="#c47b2b" stroke-width="2"/>
    <polygon points="173,158 167,146 179,146" fill="#c47b2b"/>
    <rect x="88" y="150" width="170" height="52" rx="10" fill="#e7f0e4" stroke="#c9dcc4" stroke-width="1.5"/>
    <text x="173" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2a3142">the byte buffer</text>
  </g>
  <g class="draw d2">
    <text x="560" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#8a5a22">after the move</text>
    <rect x="400" y="56" width="150" height="70" rx="12" fill="#fffdf8" stroke="#e0d6c8" stroke-width="1.5"/>
    <text x="475" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">source</text>
    <text x="475" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5c5348">_bytes = nullptr</text>
    <rect x="566" y="56" width="150" height="70" rx="12" fill="#f3e0c4" stroke="#e2c48a" stroke-width="1.5"/>
    <text x="641" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#2a3142">destination</text>
    <text x="641" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5c5348">owns the buffer</text>
    <rect x="556" y="150" width="170" height="52" rx="10" fill="#e7f0e4" stroke="#c9dcc4" stroke-width="1.5"/>
    <text x="641" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2a3142">same buffer</text>
    <line x1="641" y1="126" x2="641" y2="150" stroke="#c47b2b" stroke-width="2"/>
    <polygon points="641,158 635,146 647,146" fill="#c47b2b"/>
  </g>
</svg>
