name: Publish study site

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - 404.html
      - index.txt
      - .nojekyll
      - glossary/**
      - topics/**
      - figures/**
      - _next/**
      - "404/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        working-directory: study/web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: study/web/out
      - name: Publish the static site at the repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf glossary topics figures _next 404
          rm -f index.html 404.html index.txt
          cp -R study/web/out/. .
          touch .nojekyll
          git add index.html 404.html index.txt .nojekyll glossary topics figures _next 404
          if git diff --cached --quiet; then
            echo "Published site is already current."
          else
            git commit -m "Update the published study site."
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
