    <text x="260" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">מצביע ל-<tspan direction="ltr" unicode-bidi="embed">int</tspan> בערימה</text>
    <text x="332" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">זה השם היחיד</text>
    <rect x="28" y="180" width="324" height="100" rx="12" fill="#e7f0e4" stroke="#c9dcc4" stroke-width="1.5" />
    <text x="332" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">ערימה</text>
    <text x="332" y="240" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="end">int 9</text>
    <text x="250" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">חי, נגיש</text>
  </g>
  <g class="draw d2">
    <rect x="408" y="64" width="324" height="100" rx="12" fill="none" stroke="#b7ab9c" stroke-width="1.5" stroke-dasharray="7 6" />
    <text x="712" y="104" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">מחסנית</text>
    <text x="712" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">‏<tspan direction="ltr" unicode-bidi="embed">box</tspan> נעלם</text>
    <rect x="408" y="180" width="324" height="100" rx="12" fill="#f6e4dc" stroke="#e0b8a8" stroke-width="1.5" />
    <text x="712" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#2a3142" text-anchor="start" direction="rtl" unicode-bidi="embed">ערימה</text>
    <text x="712" y="240" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142" text-anchor="end">int 9</text>
    <text x="630" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5348" text-anchor="start" direction="rtl" unicode-bidi="embed">עדיין תפוס, בלי שם</text>
