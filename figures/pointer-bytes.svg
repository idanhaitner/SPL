    <text x="161" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#2a3142">17978</text>
    <text x="161" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5348">כתובת 0x04</text>
